server:
  port: 8080
spring:
  application:
    name: "accounts" # Follow the same name that you gave in config server
  profiles:
    active: "prod"
  config:
    import: "configserver:http://localhost:8071/"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # If no tables created, please create the table based on sql scripts
    show-sql: true # print all sql queries

